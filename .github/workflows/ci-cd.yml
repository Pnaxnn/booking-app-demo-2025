name: CI/CD Pipeline — Booking App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ยกเลิก run เก่าของ branch เดียวกันเมื่อมี push ใหม่
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ───────────── 1) Backend: migrate + Newman API tests ─────────────
  backend-test:
    name: Backend Tests (Newman API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
      JWT_SECRET: ci-test-secret-key
      PORT: 3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      # ไม่ต้อง seed แยก: database.js สร้าง admin และห้อง 3 ประเภทให้เองตอน server เริ่มทำงาน
      - name: Start backend server
        working-directory: backend
        run: |
          nohup npm start > ../server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/rooms > /dev/null; then
              echo "Server is ready"; exit 0
            fi
            sleep 2
          done
          echo "Server did not start"; cat ../server.log; exit 1

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman — booking API tests
        run: |
          mkdir -p newman-reports
          newman run tests/booking-api.postman_collection.json \
            --env-var "baseUrl=http://localhost:3001" \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/booking-api.html \
            --reporter-junit-export newman-reports/booking-api.xml

      - name: Run Newman — hotel booking tests
        run: |
          newman run newman/hotel-booking-collection.json \
            -e newman/hotel-booking-env.json \
            --env-var "baseUrl=http://localhost:3001" \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/hotel-booking.html \
            --reporter-junit-export newman-reports/hotel-booking.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: newman-reports/

      - name: Show server log on failure
        if: failure()
        run: cat server.log

  # ───────────── 2) Frontend build ─────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ───────────── 3) Security scan ─────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit — backend (High+)
        working-directory: backend
        run: npm ci && npm audit --audit-level=high

      - name: npm audit — frontend (High+)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      - name: TruffleHog — secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: booking-app
          path: .
          format: HTML
          out: owasp-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: owasp-report/

  # ───────────── 4) Deploy (main เท่านั้น) ─────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # รันจาก root ของ repo เพราะตั้ง Root Directory = frontend ไว้ในโปรเจกต์ Vercel แล้ว
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: vercel build --prod --token "$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  deploy-backend-render:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait until backend is healthy
        run: |
          TIMEOUT=600; INTERVAL=15; ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            echo "Health check... (${ELAPSED}/${TIMEOUT}s)"
            if curl -f --connect-timeout 5 --max-time 15 "${{ secrets.RENDER_BACKEND_URL }}/api/rooms" > /dev/null 2>&1; then
              echo "Render deployment is healthy"; exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Render health check failed after ${TIMEOUT}s"; exit 1

  # ───────────── 5) Post-deployment smoke test ─────────────
  post-deploy-smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend-render]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      BACKEND: ${{ secrets.RENDER_BACKEND_URL }}
      FRONTEND: ${{ secrets.VERCEL_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Newman smoke tests on production
        run: |
          npm install -g newman
          newman run tests/smoke-tests.postman_collection.json \
            --env-var "baseUrl=$BACKEND"

      - name: Check security headers
        run: |
          headers=$(curl -sI "$BACKEND/api/rooms")
          echo "$headers"
          for h in x-content-type-options x-frame-options strict-transport-security; do
            echo "$headers" | grep -qi "^$h:" || { echo "Missing header: $h"; exit 1; }
          done

      - name: Frontend reachable
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND")
          echo "Frontend HTTP $code"
          [ "$code" = "200" ]